[workspace]
members = [
  "crates/ffi",
  "crates/libraw",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
rsb-errors = { git = "https://github.com/rsb/errors-rs", tag = "v0.1.1" }
rsb-libraw-ffi = { path = "crates/ffi" }
snafu = "0.9"
tracing = "0.1"
thiserror = "2"

# Never crash, engineering/never-crash.md. The default for any new crate.
# rsb-libraw-ffi, the one crate with `unsafe`, repeats this table without
# `unsafe_code`; keep the two in step.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
