[package]
name = "rsb-libraw-ffi"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
rsb-errors = { workspace = true }
snafu = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
bindgen = "0.71"
cc = "1"

[lib]
path = "src/lib.rs"

# The workspace lints without `unsafe_code`: this crate holds every `unsafe`
# block, and each needs a safety comment. Keep in step with the root
# Cargo.toml.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
missing_assert_message = "deny"
manual_assert = "deny"
missing_panics_doc = "deny"
string_slice = "deny"
exit = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
