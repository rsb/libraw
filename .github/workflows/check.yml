name: check

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The FFI crate compiles LibRaw with g++ and runs bindgen against libclang.
      - run: sudo apt-get update && sudo apt-get install -y g++ libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --message-format short -- -D warnings
      - run: cargo test --workspace --message-format short
